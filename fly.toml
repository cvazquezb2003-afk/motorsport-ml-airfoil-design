# fly.toml app configuration file generated for inverted-wing-designer on 2026-08-13T11:16:56+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'inverted-wing-designer'
primary_region = 'lhr'

[build]
[http_service]
  internal_port = 5001
  force_https = true
  # min_machines_running: 0 de noche, 1 cuando se comparte el enlace.
  #   1 = la maquina NO se para al quedarse sin trafico. Primera visita en ~1,5 s,
  #       pero factura de forma continua en vez de solo bajo uso.
  #   0 = se para al quedarse sin trafico, y la primera visita paga el arranque en
  #       frio: arrancar la VM mas cargar ~640 MB de modelos, medido en ~40 s.
  #       Suficiente para que alguien que llega de un enlace cierre la pestana.
  # AHORA EN 1: el enlace se esta compartiendo. Con 0 la primera visita pagaba el
  # arranque en frio -- medido el 2026-08-20: 25,6 s. BAJAR A 0 cuando pase el pico.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  # 2 GB, no 1. Con 1 GB la vista /api/metodo mataba al worker por OOM: el
  # arranque son ~640 MB (modelos + ensemble) y construir las cinco figuras del
  # metodo de golpe llevo el RSS a 863 MB, medido en el log del kernel.
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
